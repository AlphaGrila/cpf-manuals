name: Site probe - free check of non-feed supplier sites (no AI)
on:
  workflow_dispatch:
    inputs:
      limit:
        description: 'Suppliers to probe (max 1000 per run)'
        default: '1000'
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SP_LIMIT: ${{ github.event.inputs.limit }}
        run: python site_probe.py
