name: Manuals library - find free manuals on the Internet Archive (no AI)

on:
  schedule:
    - cron: '13 9 * * 1'      # weekly: new free manuals posted on the Internet Archive
  workflow_dispatch:
    inputs:
      brands:
        description: 'Only these makes, comma separated (blank = all)'
        required: false
        default: ''
      dry:
        description: 'Report only, save nothing (yes/no)'
        required: false
        default: 'yes'

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          AM_BRANDS: ${{ github.event.inputs.brands }}
          AM_DRY: ${{ github.event.inputs.dry == 'yes' && '1' || '' }}
        run: python archive_manuals.py 2>&1 | tee run_output.log
